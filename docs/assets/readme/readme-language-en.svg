<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 54 54" role="img" aria-labelledby="title desc" data-badge-system="IamAngusU/Badges" data-badge-layout="squircle" data-badge-foil="blue-red-white">
  <title id="title">Read this README in English</title>
  <desc id="desc">EN language switch with a subtle blue, red and white foil. Motion stops when reduced motion is requested.</desc>
  <defs><linearGradient id="foil" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#24426e"/><stop offset=".33" stop-color="#24426e"/><stop offset=".33" stop-color="#fff"/><stop offset=".67" stop-color="#fff"/><stop offset=".67" stop-color="#c73647"/><stop offset="1" stop-color="#c73647"/></linearGradient><clipPath id="surface"><rect x="2" y="2" width="50" height="50" rx="15"/></clipPath></defs>
  <style>.badge-bg{fill:#fff;stroke:#dfe3e9}.badge-label{fill:#11151b;paint-order:stroke;stroke:#ffffffb8;stroke-width:.7px;stroke-linejoin:round}.badge-foil{opacity:.26;animation:sweep 7.6s cubic-bezier(.45,0,.55,1) infinite;pointer-events:none}@keyframes sweep{0%,12%{transform:translateX(-76px)}54%,100%{transform:translateX(76px)}}@media(prefers-reduced-motion:reduce){.badge-foil{animation:none;transform:translateX(0)}}@media(prefers-color-scheme:dark){.badge-bg{fill:#0b0f14;stroke:#303741}.badge-label{fill:#f7f8fa;stroke:#0b0f14cc}.badge-foil{opacity:.36}}</style>
  <rect class="badge-bg" x="1" y="1" width="52" height="52" rx="16"/>
  <g clip-path="url(#surface)" aria-hidden="true"><path class="badge-foil" d="M20-8h34L38 62H4z" fill="url(#foil)"/></g>
  <text class="badge-label" x="27" y="34" text-anchor="middle" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif" font-size="20" font-weight="760" letter-spacing=".4">EN</text>
</svg>
