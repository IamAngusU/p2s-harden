name: Audit feedback
description: Report compatibility, incomplete discovery or an unexpected finding.
title: "Audit feedback: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing p2s-harden. Please share only reviewed, redacted output.
        Run `--doctor --redact --json` and, when useful, `--check --redact --json`.
        Capture stdout only: SSH/system stderr may still identify your host.
        Do not include credentials, raw configuration dumps or private targets.
        Use private vulnerability reporting for suspected vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Tool version
      placeholder: "Output of --version"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Target distribution and PHP version
      placeholder: "For example Debian 13 / distro PHP 8.4"
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: PHP layout
      options:
        - Host FPM with systemd
        - Host FPM without systemd
        - Container or other layout
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the command/options with private values replaced, the result and what you expected.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Reviewed redacted JSON report
      description: Optional; useful facts remain, while host identifiers are omitted.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I reviewed the report and removed private data; I did not paste raw SSH/system stderr.
          required: true
