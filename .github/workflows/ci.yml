name: CLI tests
on:
  push:
    branches: [release/2.2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["python:3.8.20-slim-bookworm", "python:3.12-slim-bookworm"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fixture tests in disposable Linux container
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --cpus 2 --memory 768m \
            -v "$GITHUB_WORKSPACE:/source:ro" "$TEST_IMAGE" /bin/sh -c '
              apt-get update -qq &&
              apt-get install -y -qq --no-install-recommends bash procps util-linux &&
              bash /source/tools/test-linux.sh
            '
  fpm:
    name: PHP-FPM ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Real PHP-FPM settings and audit comparison
        env:
          PHP_IMAGE: php:${{ matrix.php }}-fpm-bookworm
        run: |
          mkdir -p artifacts
          python3 -B tools/test_fpm_runtime.py --engine p2s_harden.py \
            --image "$PHP_IMAGE" --json > artifacts/fpm-runtime.json
      - name: Summarize runtime evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/fpm-runtime.json").read_text())
          for image in report.get("images", []):
              passed = sum(case["status"] == "PASS" for case in image["cases"])
              print(f"{image['image']}: {passed}/{len(image['cases'])} observed cases passed")
              if image.get("error"):
                  print("Incomplete runtime evidence: " + image["error"])
              for case in image["cases"]:
                  for failure in case["failures"]:
                      print(case["name"] + ": " + failure)
          if report.get("error"):
              print("Incomplete runtime evidence: " + report["error"])
          PY
      - name: Retain runtime image identities and observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fpm-runtime-php-${{ matrix.php }}
          path: artifacts/fpm-runtime.json
          if-no-files-found: error
          retention-days: 30
  system_ubuntu:
    name: System Ubuntu ${{ matrix.release }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {release: "22.04", php: "8.1"}
          - {release: "24.04", php: "8.3"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Real Ubuntu systemd discovery, fix and rollback
        uses: vmactions/ubuntu-vm@3b554fb5d71472e2d3829d9a11160de0d91f463b # v1.0.2
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          mem: 2048
          cpu: 2
          sync: rsync
          prepare: |
            set -eu
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 nginx php-fpm procps util-linux
            printf 'p2s-harden disposable system test\n' > /etc/p2s-disposable-ci
            chmod 600 /etc/p2s-disposable-ci
          run: |
            set -eu
            mkdir -p artifacts
            P2S_DISPOSABLE_SYSTEM_TEST=1 python3 -B tools/test_system_runtime.py --expect-php ${{ matrix.php }} --json > artifacts/system-runtime.json
      - name: Retain Ubuntu system evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-runtime-ubuntu-${{ matrix.release }}
          path: artifacts/system-runtime.json
          if-no-files-found: error
          retention-days: 30
  system_debian:
    name: System Debian ${{ matrix.release }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {release: "12", php: "8.2"}
          - {release: "13", php: "8.4"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Real Debian systemd discovery, fix and rollback
        uses: vmactions/debian-vm@626b64f9a6be64bbeaf3850f8bac2532d4e77db4 # v1.0.1
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          mem: 2048
          cpu: 2
          sync: rsync
          prepare: |
            set -eu
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 nginx php-fpm procps util-linux
            printf 'p2s-harden disposable system test\n' > /etc/p2s-disposable-ci
            chmod 600 /etc/p2s-disposable-ci
          run: |
            set -eu
            mkdir -p artifacts
            P2S_DISPOSABLE_SYSTEM_TEST=1 python3 -B tools/test_system_runtime.py --expect-php ${{ matrix.php }} --json > artifacts/system-runtime.json
      - name: Retain Debian system evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-runtime-debian-${{ matrix.release }}
          path: artifacts/system-runtime.json
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check generated launchers
        run: python build-standalone.py --check
      - name: PowerShell native transport tests
        shell: powershell
        run: .\test-windows-launcher.ps1
  provenance:
    name: Release provenance
    needs: [linux, fpm, system_ubuntu, system_debian, windows]
    if: ${{ github.repository == 'angusu-de/p2s-harden' && github.ref == 'refs/heads/release/2.2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rebuild exact tested source and require matching public heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/IamAngusU/php-fpm-audit/git/ref/heads/release/2.2 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/angusu-de/p2s-harden/git/ref/heads/release/2.2 --jq .object.sha)" = "$GITHUB_SHA"
          python3 -B build-standalone.py --check
          python3 -B tools/package-release.py
          git diff --exit-code -- SHA256.json
      - name: Sign build provenance for all four distribution files
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Retain exact distribution files and signed bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p provenance
          cp -- "$BUNDLE_PATH" provenance/p2s-harden-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: |
            dist/*
            provenance/*
          if-no-files-found: error
          retention-days: 30
