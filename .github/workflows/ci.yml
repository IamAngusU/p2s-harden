name: CLI tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["python:3.8.20-slim-bookworm", "python:3.12-slim-bookworm"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fixture tests in disposable Linux container
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --cpus 2 --memory 768m \
            -v "$GITHUB_WORKSPACE:/source:ro" "$TEST_IMAGE" /bin/sh -c '
              apt-get update -qq &&
              apt-get install -y -qq --no-install-recommends bash curl procps util-linux &&
              bash /source/tools/test-linux.sh
            '
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check generated launchers
        run: python build-standalone.py --check
      - name: PowerShell native transport tests
        shell: powershell
        run: .\test-windows-launcher.ps1
